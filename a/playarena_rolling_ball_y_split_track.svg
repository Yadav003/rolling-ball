<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd879"/>
      <stop offset=".55" stop-color="#dfa04a"/>
      <stop offset="1" stop-color="#9b5c28"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65798b"/>
      <stop offset="1" stop-color="#253746"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <path d="M80 690 L500 690 L690 520 L850 520 L1030 690 L1030 800 L80 800Z"
        fill="#071522" opacity=".4" filter="url(#shadow)"/>

  <!-- Structural base -->
  <path d="M105 120 L500 120 L500 330 L650 330
           C715 330 750 285 750 220 L750 120 L855 120
           L855 260 C855 425 760 510 625 510 L545 510
           L545 700 L105 700Z"
        fill="url(#side)" stroke="#172633" stroke-width="10"/>

  <!-- Main Y-split wooden deck -->
  <path d="M135 100 L475 100 L475 310
           L625 310
           C680 310 710 270 710 210
           L710 100 L825 100
           L825 250
           C825 390 740 455 610 455
           L520 455
           L520 670 L135 670Z"
        fill="url(#wood)" stroke="#774820" stroke-width="8"/>

  <!-- Left branch -->
  <path d="M135 100 L475 100 L475 310 L135 670Z"
        fill="url(#wood)" opacity=".98"/>

  <!-- Right branch -->
  <path d="M475 310 L625 310 C680 310 710 270 710 210 L710 100 L825 100
           L825 250 C825 390 740 455 610 455 L520 455Z"
        fill="url(#wood)" opacity=".98"/>

  <!-- Plank lines -->
  <g fill="none" stroke="#a96a31" stroke-width="5" opacity=".82">
    <path d="M140 155 L470 155"/>
    <path d="M140 215 L470 215"/>
    <path d="M140 275 L470 275"/>
    <path d="M150 335 L465 335"/>
    <path d="M165 395 L465 395"/>
    <path d="M190 455 L465 455"/>
    <path d="M220 515 L465 515"/>
    <path d="M260 575 L465 575"/>
    <path d="M315 635 L465 635"/>

    <path d="M520 350 L610 350 C690 350 750 310 765 240"/>
    <path d="M520 395 L620 395 C720 395 790 340 800 250"/>
  </g>

  <!-- Outer left rail -->
  <path d="M110 100 L475 100 L475 310 L115 690"
        fill="none" stroke="#151b20" stroke-width="42" stroke-linecap="round"/>
  <path d="M110 100 L475 100 L475 310 L115 690"
        fill="none" stroke="#f2bf24" stroke-width="34" stroke-dasharray="68 44"/>
  <path d="M110 100 L475 100 L475 310 L115 690"
        fill="none" stroke="#171b20" stroke-width="34" stroke-dasharray="44 68" stroke-dashoffset="44"/>

  <!-- Right branch outer rail -->
  <path d="M710 100 L825 100 L825 250 C825 390 740 455 610 455 L520 455"
        fill="none" stroke="#151b20" stroke-width="42" stroke-linecap="round"/>
  <path d="M710 100 L825 100 L825 250 C825 390 740 455 610 455 L520 455"
        fill="none" stroke="#f2bf24" stroke-width="34" stroke-dasharray="68 44"/>
  <path d="M710 100 L825 100 L825 250 C825 390 740 455 610 455 L520 455"
        fill="none" stroke="#171b20" stroke-width="34" stroke-dasharray="44 68" stroke-dashoffset="44"/>

  <!-- Inner split rail -->
  <path d="M475 100 L475 310 L520 455 L520 670"
        fill="none" stroke="#151b20" stroke-width="38" stroke-linecap="round"/>
  <path d="M475 100 L475 310 L520 455 L520 670"
        fill="none" stroke="#f2bf24" stroke-width="30" stroke-dasharray="62 40"/>
  <path d="M475 100 L475 310 L520 455 L520 670"
        fill="none" stroke="#171b20" stroke-width="30" stroke-dasharray="40 62" stroke-dashoffset="40"/>

  <!-- Rail highlights -->
  <path d="M110 91 L475 91 L475 310 L115 690"
        fill="none" stroke="#fff19a" stroke-width="4" opacity=".7"/>
  <path d="M710 91 L825 91 L834 250 C834 395 745 463 610 463"
        fill="none" stroke="#fff19a" stroke-width="4" opacity=".7"/>

  <!-- Support posts -->
  <g fill="#273744">
    <rect x="170" y="625" width="16" height="100" rx="4"/>
    <rect x="330" y="555" width="16" height="115" rx="4"/>
    <rect x="680" y="390" width="16" height="90" rx="4" transform="rotate(22 688 435)"/>
    <rect x="790" y="300" width="16" height="90" rx="4"/>
  </g>

  <!-- Bolts -->
  <g fill="#8ea0ab" stroke="#263640" stroke-width="3">
    <circle cx="210" cy="100" r="6"/>
    <circle cx="390" cy="100" r="6"/>
    <circle cx="770" cy="100" r="6"/>
    <circle cx="800" cy="310" r="6"/>
    <circle cx="650" cy="445" r="6"/>
  </g>
</svg>