<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd978"/>
      <stop offset="0.55" stop-color="#e2a34c"/>
      <stop offset="1" stop-color="#a9632b"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#617487"/>
      <stop offset="1" stop-color="#263746"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe55a"/>
      <stop offset=".5" stop-color="#e5aa18"/>
      <stop offset="1" stop-color="#a96509"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <pattern id="checks" width="64" height="48" patternUnits="userSpaceOnUse">
      <rect width="64" height="48" fill="#f5f5f5"/>
      <rect width="32" height="24" fill="#171b20"/>
      <rect x="32" y="24" width="32" height="24" fill="#171b20"/>
    </pattern>
  </defs>

  <!-- Soft shadow -->
  <path d="M112 720 L688 720 L735 790 L65 790Z"
        fill="#071522" opacity=".4" filter="url(#shadow)"/>

  <!-- Dark structural base -->
  <path d="M118 112 L682 112 L725 760 L75 760Z"
        fill="url(#side)" stroke="#162330" stroke-width="10"/>

  <!-- Wooden track -->
  <path d="M145 100 L655 100 L695 720 L105 720Z"
        fill="url(#wood)" stroke="#7c4b23" stroke-width="8"/>

  <!-- Wooden planks -->
  <g stroke="#a66b31" stroke-width="5" opacity=".8">
    <path d="M139 155 L665 155"/>
    <path d="M136 210 L669 210"/>
    <path d="M132 265 L673 265"/>
    <path d="M128 320 L676 320"/>
    <path d="M124 375 L680 375"/>
    <path d="M120 430 L684 430"/>
    <path d="M116 485 L687 485"/>
    <path d="M112 540 L691 540"/>
    <path d="M108 595 L694 595"/>
    <path d="M105 655 L698 655"/>
  </g>

  <!-- Subtle plank grain -->
  <g fill="none" stroke="#fff0aa" stroke-width="3" opacity=".22">
    <path d="M210 130 C260 142 300 137 350 126"/>
    <path d="M470 180 C520 169 565 172 615 184"/>
    <path d="M220 350 C275 338 320 342 370 352"/>
    <path d="M430 470 C490 456 545 460 600 476"/>
    <path d="M180 610 C235 595 285 602 340 615"/>
  </g>

  <!-- Finish line -->
  <path d="M124 285 L672 285 L675 350 L127 350Z"
        fill="url(#checks)" stroke="#6f4725" stroke-width="5"/>

  <!-- Finish line upper highlight -->
  <path d="M128 285 L672 285" stroke="#fff6c9" stroke-width="5" opacity=".65"/>

  <!-- Left rail dark body -->
  <path d="M123 92 L157 92 L104 720 L70 720Z"
        fill="#151b20"/>
  <!-- Left rail yellow/black sections -->
  <g>
    <path d="M119 105 L153 105 L148 165 L114 165Z" fill="url(#rail)"/>
    <path d="M113 175 L148 175 L143 235 L108 235Z" fill="#171b20"/>
    <path d="M108 245 L142 245 L137 305 L103 305Z" fill="url(#rail)"/>
    <path d="M102 315 L137 315 L132 375 L97 375Z" fill="#171b20"/>
    <path d="M96 385 L131 385 L126 445 L91 445Z" fill="url(#rail)"/>
    <path d="M90 455 L125 455 L120 515 L85 515Z" fill="#171b20"/>
    <path d="M84 525 L119 525 L114 585 L79 585Z" fill="url(#rail)"/>
    <path d="M78 595 L113 595 L108 655 L73 655Z" fill="#171b20"/>
    <path d="M72 665 L107 665 L102 715 L68 715Z" fill="url(#rail)"/>
  </g>

  <!-- Right rail dark body -->
  <path d="M647 92 L681 92 L730 720 L696 720Z"
        fill="#151b20"/>
  <!-- Right rail yellow/black sections -->
  <g>
    <path d="M647 105 L681 105 L686 165 L652 165Z" fill="url(#rail)"/>
    <path d="M652 175 L686 175 L691 235 L657 235Z" fill="#171b20"/>
    <path d="M657 245 L691 245 L696 305 L662 305Z" fill="url(#rail)"/>
    <path d="M662 315 L696 315 L701 375 L667 375Z" fill="#171b20"/>
    <path d="M667 385 L701 385 L706 445 L672 445Z" fill="url(#rail)"/>
    <path d="M672 455 L706 455 L711 515 L677 515Z" fill="#171b20"/>
    <path d="M677 525 L711 525 L716 585 L682 585Z" fill="url(#rail)"/>
    <path d="M682 595 L716 595 L721 655 L687 655Z" fill="#171b20"/>
    <path d="M687 665 L721 665 L726 715 L692 715Z" fill="url(#rail)"/>
  </g>

  <!-- Rail highlights -->
  <path d="M133 100 L78 715" fill="none" stroke="#fff19a" stroke-width="4" opacity=".7"/>
  <path d="M667 100 L721 715" fill="none" stroke="#fff19a" stroke-width="4" opacity=".7"/>

  <!-- Track end lip -->
  <path d="M103 720 L695 720 L725 760 L75 760Z"
        fill="#8797a2" stroke="#263541" stroke-width="6"/>
  <path d="M118 720 L680 720 L696 742 L102 742Z"
        fill="#d18b39"/>

  <!-- Bolts -->
  <g fill="#657887" stroke="#263541" stroke-width="3">
    <circle cx="140" cy="145" r="6"/><circle cx="660" cy="145" r="6"/>
    <circle cx="126" cy="450" r="6"/><circle cx="685" cy="450" r="6"/>
    <circle cx="108" cy="650" r="6"/><circle cx="702" cy="650" r="6"/>
  </g>
</svg>