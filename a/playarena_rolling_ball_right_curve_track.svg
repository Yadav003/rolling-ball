<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd879"/>
      <stop offset=".55" stop-color="#dfa04a"/>
      <stop offset="1" stop-color="#9b5c28"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65798b"/>
      <stop offset="1" stop-color="#253746"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <path d="M110 760 L780 760 L900 640 L900 820 L180 840Z"
        fill="#071522" opacity=".42" filter="url(#shadow)"/>

  <!-- Structural body: 90-degree right turn -->
  <path d="M120 120 L820 120 L870 170 L870 390
           C870 520 770 650 650 730
           L450 850 L150 850
           L150 690 L500 500
           C570 462 610 405 610 335
           L610 170 L120 170Z"
        fill="url(#side)" stroke="#172633" stroke-width="10"/>

  <!-- Wooden deck -->
  <path d="M145 105 L795 105 L835 150 L835 365
           C835 480 755 585 635 660
           L440 780 L175 780
           L175 715 L520 515
           C600 470 645 405 645 325
           L645 150 L145 150Z"
        fill="url(#wood)" stroke="#774820" stroke-width="8"/>

  <!-- Plank lines -->
  <g fill="none" stroke="#a96a31" stroke-width="5" opacity=".82">
    <path d="M145 175 L650 175"/>
    <path d="M145 225 L650 225"/>
    <path d="M145 275 L650 275"/>
    <path d="M145 325 L645 325"/>
    <path d="M150 375 C430 375 570 375 620 405"/>
    <path d="M165 430 C430 430 535 440 590 470"/>
    <path d="M190 485 C405 485 490 505 535 530"/>
    <path d="M245 545 C385 545 450 565 485 590"/>
    <path d="M305 610 C385 610 425 625 445 650"/>
    <path d="M220 690 L410 690"/>
    <path d="M180 740 L335 740"/>
  </g>

  <!-- Outer rail -->
  <path d="M120 105 L800 105 L850 155 L850 370
           C850 510 765 625 645 700 L445 820"
        fill="none" stroke="#151b20" stroke-width="42" stroke-linecap="round"/>

  <path d="M120 105 L800 105 L850 155 L850 370
           C850 510 765 625 645 700 L445 820"
        fill="none" stroke="#f2bf24" stroke-width="34"
        stroke-dasharray="68 44"/>

  <path d="M120 105 L800 105 L850 155 L850 370
           C850 510 765 625 645 700 L445 820"
        fill="none" stroke="#171b20" stroke-width="34"
        stroke-dasharray="44 68" stroke-dashoffset="44"/>

  <!-- Inner rail -->
  <path d="M145 150 L650 150 L650 325
           C650 405 605 470 525 515
           L175 715"
        fill="none" stroke="#151b20" stroke-width="42" stroke-linecap="round"/>

  <path d="M145 150 L650 150 L650 325
           C650 405 605 470 525 515
           L175 715"
        fill="none" stroke="#f2bf24" stroke-width="34"
        stroke-dasharray="68 44"/>

  <path d="M145 150 L650 150 L650 325
           C650 405 605 470 525 515
           L175 715"
        fill="none" stroke="#171b20" stroke-width="34"
        stroke-dasharray="44 68" stroke-dashoffset="44"/>

  <!-- Rail highlights -->
  <path d="M120 96 L800 96 L858 150 L858 370
           C858 515 770 635 650 708"
        fill="none" stroke="#fff19a" stroke-width="4" opacity=".7"/>
  <path d="M145 141 L650 141 L658 325
           C658 410 610 478 530 523"
        fill="none" stroke="#fff19a" stroke-width="4" opacity=".7"/>

  <!-- Support posts -->
  <g fill="#273744">
    <rect x="205" y="125" width="15" height="75" rx="4"/>
    <rect x="400" y="125" width="15" height="75" rx="4"/>
    <rect x="785" y="180" width="15" height="90" rx="4"/>
    <rect x="790" y="430" width="15" height="90" rx="4" transform="rotate(22 797 475)"/>
    <rect x="620" y="675" width="15" height="90" rx="4" transform="rotate(55 627 720)"/>
  </g>

  <!-- Bolts -->
  <g fill="#8ea0ab" stroke="#263640" stroke-width="3">
    <circle cx="250" cy="125" r="6"/>
    <circle cx="520" cy="125" r="6"/>
    <circle cx="820" cy="245" r="6"/>
    <circle cx="790" cy="490" r="6"/>
    <circle cx="585" cy="690" r="6"/>
    <circle cx="260" cy="765" r="6"/>
  </g>

  <!-- End lips for modular connection -->
  <path d="M120 105 L145 150 L145 105Z" fill="#8798a3"/>
  <path d="M175 715 L175 780 L440 780 L465 765 L175 715Z"
        fill="#7b8d99" opacity=".8"/>
</svg>