<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900">
  <defs>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8fb"/>
      <stop offset=".45" stop-color="#9aabb7"/>
      <stop offset="1" stop-color="#50616e"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9f52e"/>
      <stop offset=".55" stop-color="#62c51d"/>
      <stop offset="1" stop-color="#398d12"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52d9ff"/>
      <stop offset="1" stop-color="#1976c8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="350" cy="820" rx="220" ry="35"
           fill="#071522" opacity=".4" filter="url(#shadow)"/>

  <!-- Checkpoint arch supports -->
  <path d="M145 780 L175 780 L190 220 L155 220Z"
        fill="url(#post)" stroke="#344754" stroke-width="7"/>
  <path d="M525 220 L510 780 L545 780 L565 220Z"
        fill="url(#post)" stroke="#344754" stroke-width="7"/>

  <!-- Feet -->
  <path d="M115 775 L205 775 L225 815 L95 815Z"
        fill="#3a4b58" stroke="#172631" stroke-width="7"/>
  <path d="M495 775 L585 775 L605 815 L475 815Z"
        fill="#3a4b58" stroke="#172631" stroke-width="7"/>

  <!-- Main checkpoint header -->
  <path d="M145 210 Q350 135 555 210 L555 315 Q350 250 145 315Z"
        fill="#18232d" stroke="#0d151c" stroke-width="9"/>

  <!-- Green illuminated checkpoint band -->
  <path d="M157 218 Q350 158 543 218 L543 285 Q350 230 157 285Z"
        fill="url(#green)" stroke="#2f7e12" stroke-width="5"/>

  <!-- Center glowing emblem -->
  <circle cx="350" cy="220" r="58" fill="#0c1c25" stroke="#78df29" stroke-width="7"/>
  <circle cx="350" cy="220" r="42" fill="url(#blue)" opacity=".95"/>
  <path d="M350 187 L369 215 L357 215 L357 252 L343 252 L343 215 L331 215Z"
        fill="#efffff"/>

  <!-- Checkpoint text plate -->
  <path d="M225 286 Q350 250 475 286 L465 345 Q350 315 235 345Z"
        fill="#111b23" stroke="#2b3b46" stroke-width="6"/>
  <text x="350" y="321" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="32" font-weight="800"
        fill="#b7ff55" letter-spacing="4">CHECKPOINT</text>

  <!-- Side indicator lights -->
  <g>
    <circle cx="180" cy="350" r="16" fill="#63e425"/>
    <circle cx="520" cy="350" r="16" fill="#63e425"/>
    <circle cx="180" cy="350" r="7" fill="#eaffd2"/>
    <circle cx="520" cy="350" r="7" fill="#eaffd2"/>
  </g>

  <!-- Vertical green light strips -->
  <path d="M163 380 L190 380 L185 650 L158 650Z" fill="url(#green)" opacity=".9"/>
  <path d="M510 380 L537 380 L542 650 L515 650Z" fill="url(#green)" opacity=".9"/>

  <!-- Small bolts -->
  <g fill="#dce7ee" stroke="#435663" stroke-width="3">
    <circle cx="175" cy="240" r="7"/>
    <circle cx="525" cy="240" r="7"/>
    <circle cx="175" cy="710" r="7"/>
    <circle cx="525" cy="710" r="7"/>
  </g>

  <!-- Ground glow -->
  <path d="M205 785 Q350 740 495 785 Q350 825 205 785Z"
        fill="#6fe82b" opacity=".2"/>
</svg>