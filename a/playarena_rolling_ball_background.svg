<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48b9ff"/>
      <stop offset="0.48" stop-color="#8bdcff"/>
      <stop offset="1" stop-color="#dff7ff"/>
    </linearGradient>

    <radialGradient id="sun">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".45" stop-color="#fff8c7" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff8c7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa84b"/>
      <stop offset="1" stop-color="#245c45"/>
    </linearGradient>

    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#738ca5"/>
      <stop offset="1" stop-color="#263d59"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1510" cy="185" r="180" fill="url(#sun)"/>
  <circle cx="1510" cy="185" r="52" fill="#fffdf0"/>

  <!-- High clouds -->
  <g fill="#fff" opacity=".72">
    <ellipse cx="180" cy="190" rx="170" ry="65"/>
    <ellipse cx="300" cy="175" rx="130" ry="80"/>
    <ellipse cx="430" cy="210" rx="190" ry="58"/>
    <ellipse cx="830" cy="160" rx="170" ry="50"/>
    <ellipse cx="980" cy="180" rx="130" ry="65"/>
    <ellipse cx="1740" cy="280" rx="190" ry="60"/>
    <ellipse cx="1840" cy="255" rx="120" ry="75"/>
  </g>

  <!-- Distant clouds -->
  <g fill="#f8fdff" opacity=".9" filter="url(#blur)">
    <ellipse cx="220" cy="560" rx="300" ry="100"/>
    <ellipse cx="760" cy="520" rx="330" ry="100"/>
    <ellipse cx="1300" cy="575" rx="350" ry="110"/>
    <ellipse cx="1740" cy="530" rx="330" ry="100"/>
  </g>

  <!-- Floating islands -->
  <g>
    <path d="M40 575 Q190 520 335 570 L305 650 L270 755 L120 735 L70 660Z" fill="url(#rock)"/>
    <path d="M35 575 Q185 515 340 570 Q185 625 35 575Z" fill="url(#island)"/>
    <circle cx="145" cy="545" r="22" fill="#2d743f"/>
    <circle cx="180" cy="535" r="30" fill="#438d42"/>

    <path d="M520 500 Q660 455 790 505 L755 590 L720 675 L590 665 L545 590Z" fill="url(#rock)"/>
    <path d="M515 500 Q650 445 795 505 Q650 555 515 500Z" fill="url(#island)"/>
    <circle cx="650" cy="470" r="28" fill="#3c8841"/>

    <path d="M1080 525 Q1230 470 1375 530 L1340 615 L1305 700 L1160 685 L1110 610Z" fill="url(#rock)"/>
    <path d="M1075 525 Q1225 465 1380 530 Q1220 580 1075 525Z" fill="url(#island)"/>
    <circle cx="1245" cy="485" r="27" fill="#3d8943"/>

    <path d="M1570 570 Q1710 520 1885 575 L1850 660 L1810 750 L1660 725 L1610 650Z" fill="url(#rock)"/>
    <path d="M1565 570 Q1710 515 1890 575 Q1720 625 1565 570Z" fill="url(#island)"/>
    <circle cx="1740" cy="535" r="29" fill="#438e43"/>
  </g>

  <!-- Waterfalls -->
  <g opacity=".82">
    <path d="M135 610 C120 700 120 760 140 820 C155 765 160 700 150 615Z" fill="#67d7ff"/>
    <path d="M665 545 C650 625 655 680 670 735 C690 680 692 620 680 545Z" fill="#6bdcff"/>
    <path d="M1210 570 C1190 650 1195 710 1215 770 C1235 700 1235 640 1225 570Z" fill="#67d7ff"/>
    <path d="M1730 610 C1710 690 1715 750 1735 815 C1755 750 1755 680 1745 610Z" fill="#67d7ff"/>
  </g>

  <!-- Foreground mist -->
  <path d="M0 850 Q280 760 540 850 T1080 845 T1620 850 T1920 820 L1920 1080 L0 1080Z"
        fill="#fff" opacity=".62"/>
  <path d="M0 950 Q320 860 650 950 T1300 945 T1920 930 L1920 1080 L0 1080Z"
        fill="#eefcff" opacity=".8"/>
</svg>