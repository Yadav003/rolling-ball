<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ball" cx="34%" cy="28%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.16" stop-color="#dff6ff"/>
      <stop offset="0.42" stop-color="#59c8ff"/>
      <stop offset="0.72" stop-color="#1675d1"/>
      <stop offset="0.92" stop-color="#083b82"/>
      <stop offset="1" stop-color="#031d48"/>
    </radialGradient>

    <radialGradient id="highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8df2ff"/>
      <stop offset=".45" stop-color="#13b7ff"/>
      <stop offset="1" stop-color="#0056b8"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="clip">
      <circle cx="256" cy="242" r="170"/>
    </clipPath>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="270" cy="425" rx="150" ry="30" fill="#00152f" opacity=".35" filter="url(#shadow)"/>

  <!-- outer ball -->
  <circle cx="256" cy="242" r="176" fill="#031a38" opacity=".9"/>
  <circle cx="256" cy="242" r="170" fill="url(#ball)"/>

  <!-- futuristic curved bands -->
  <g clip-path="url(#clip)" fill="none" stroke="url(#ring)" stroke-linecap="round">
    <path d="M74 168 C135 84 269 50 375 104 C429 132 462 183 472 238"
          stroke-width="18" opacity=".9"/>
    <path d="M55 280 C126 364 245 393 355 346 C414 321 452 280 472 226"
          stroke-width="13" opacity=".75"/>
    <path d="M116 76 C94 156 106 244 155 315 C190 366 245 395 307 404"
          stroke-width="10" opacity=".6"/>
    <path d="M362 72 C391 151 390 236 353 305 C326 355 283 382 230 397"
          stroke-width="8" opacity=".55"/>
  </g>

  <!-- center accent -->
  <path d="M116 235 C155 174 218 145 283 150 C333 154 374 177 398 211"
        fill="none" stroke="#8df6ff" stroke-width="9" opacity=".8" filter="url(#glow)"/>
  <path d="M119 257 C163 315 222 337 286 330 C332 325 371 304 395 271"
        fill="none" stroke="#0b5fc0" stroke-width="12" opacity=".8"/>

  <!-- specular highlights -->
  <ellipse cx="191" cy="151" rx="75" ry="42" fill="url(#highlight)" transform="rotate(-28 191 151)"/>
  <circle cx="166" cy="128" r="17" fill="#fff" opacity=".82"/>
  <circle cx="143" cy="153" r="7" fill="#fff" opacity=".58"/>

  <!-- small technical details -->
  <g fill="#baf8ff" opacity=".8">
    <circle cx="337" cy="150" r="5"/>
    <circle cx="365" cy="171" r="4"/>
    <circle cx="390" cy="198" r="3"/>
    <circle cx="137" cy="293" r="4"/>
    <circle cx="157" cy="319" r="3"/>
  </g>

  <!-- subtle outline -->
  <circle cx="256" cy="242" r="170" fill="none" stroke="#8eeeff" stroke-width="3" opacity=".7"/>
</svg>