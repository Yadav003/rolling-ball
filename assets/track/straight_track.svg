<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <!-- Wooden track surface -->
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8c96b"/>
      <stop offset="0.5" stop-color="#d99a43"/>
      <stop offset="1" stop-color="#a9672e"/>
    </linearGradient>

    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34465a"/>
      <stop offset="1" stop-color="#111d2b"/>
    </linearGradient>

    <linearGradient id="railYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe55a"/>
      <stop offset="1" stop-color="#e8a900"/>
    </linearGradient>

    <linearGradient id="railBlack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252b32"/>
      <stop offset="1" stop-color="#080b0f"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <pattern id="planks" width="92" height="1" patternUnits="userSpaceOnUse">
      <rect width="92" height="1" fill="#9b5d28"/>
    </pattern>
  </defs>

  <!-- Track shadow -->
  <path d="M155 110 L1045 110 L1170 650 L30 650 Z"
        fill="#061321" opacity=".45" filter="url(#shadow)"/>

  <!-- Left structural side -->
  <path d="M145 90 L270 90 L125 665 L30 665 Z"
        fill="url(#side)"/>

  <!-- Right structural side -->
  <path d="M930 90 L1055 90 L1170 665 L1075 665 Z"
        fill="url(#side)"/>

  <!-- Main wooden deck -->
  <path d="M175 90 L1025 90 L1080 650 L120 650 Z"
        fill="url(#wood)"
        stroke="#74451f"
        stroke-width="8"/>

  <!-- Wooden plank lines -->
  <g stroke="#9b622d" stroke-width="5" opacity=".8">
    <path d="M168 145 L1035 145"/>
    <path d="M160 200 L1042 200"/>
    <path d="M153 255 L1049 255"/>
    <path d="M145 310 L1056 310"/>
    <path d="M138 365 L1063 365"/>
    <path d="M130 420 L1070 420"/>
    <path d="M123 475 L1076 475"/>
    <path d="M117 530 L1080 530"/>
    <path d="M110 590 L1087 590"/>
  </g>

  <!-- subtle wood grain -->
  <g fill="none" stroke="#fff0b0" stroke-width="3" opacity=".18">
    <path d="M250 115 C310 130 350 125 420 112"/>
    <path d="M560 170 C640 150 700 155 770 172"/>
    <path d="M330 280 C400 265 455 270 520 285"/>
    <path d="M710 355 C790 340 850 345 920 360"/>
    <path d="M250 500 C330 480 400 485 470 505"/>
  </g>

  <!-- Left safety rail support -->
  <path d="M145 92 L175 92 L115 650 L82 650 Z"
        fill="#202a34"/>

  <!-- Right safety rail support -->
  <path d="M1025 92 L1055 92 L1118 650 L1085 650 Z"
        fill="#202a34"/>

  <!-- Left yellow/black safety rail -->
  <g>
    <path d="M137 82 L172 82 L110 650 L74 650 Z" fill="#12171d"/>
    <path d="M132 100 L164 100 L158 155 L126 155 Z" fill="url(#railYellow)"/>
    <path d="M124 170 L158 170 L151 225 L118 225 Z" fill="url(#railBlack)"/>
    <path d="M116 240 L151 240 L145 295 L110 295 Z" fill="url(#railYellow)"/>
    <path d="M108 310 L145 310 L139 365 L102 365 Z" fill="url(#railBlack)"/>
    <path d="M100 380 L139 380 L133 435 L94 435 Z" fill="url(#railYellow)"/>
    <path d="M92 450 L132 450 L126 505 L86 505 Z" fill="url(#railBlack)"/>
    <path d="M84 520 L125 520 L119 575 L78 575 Z" fill="url(#railYellow)"/>
    <path d="M77 590 L118 590 L112 645 L71 645 Z" fill="url(#railBlack)"/>
  </g>

  <!-- Right yellow/black safety rail -->
  <g>
    <path d="M1028 82 L1063 82 L1128 650 L1092 650 Z" fill="#12171d"/>
    <path d="M1030 100 L1062 100 L1068 155 L1036 155 Z" fill="url(#railYellow)"/>
    <path d="M1038 170 L1070 170 L1077 225 L1044 225 Z" fill="url(#railBlack)"/>
    <path d="M1046 240 L1081 240 L1087 295 L1052 295 Z" fill="url(#railYellow)"/>
    <path d="M1054 310 L1091 310 L1097 365 L1060 365 Z" fill="url(#railBlack)"/>
    <path d="M1062 380 L1101 380 L1107 435 L1068 435 Z" fill="url(#railYellow)"/>
    <path d="M1070 450 L1110 450 L1116 505 L1076 505 Z" fill="url(#railBlack)"/>
    <path d="M1078 520 L1119 520 L1125 575 L1085 575 Z" fill="url(#railYellow)"/>
    <path d="M1086 590 L1127 590 L1133 645 L1092 645 Z" fill="url(#railBlack)"/>
  </g>

  <!-- Rail highlights -->
  <path d="M150 92 L87 650" stroke="#fff08a" stroke-width="4" opacity=".65"/>
  <path d="M1048 92 L1110 650" stroke="#fff08a" stroke-width="4" opacity=".65"/>

  <!-- Track bolts -->
  <g fill="#6d431f" opacity=".9">
    <circle cx="210" cy="145" r="5"/><circle cx="990" cy="145" r="5"/>
    <circle cx="203" cy="255" r="5"/><circle cx="1000" cy="255" r="5"/>
    <circle cx="190" cy="365" r="5"/><circle cx="1010" cy="365" r="5"/>
    <circle cx="176" cy="475" r="5"/><circle cx="1022" cy="475" r="5"/>
    <circle cx="160" cy="590" r="5"/><circle cx="1040" cy="590" r="5"/>
  </g>
</svg>