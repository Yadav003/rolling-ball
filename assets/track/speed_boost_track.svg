<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd879"/>
      <stop offset=".55" stop-color="#dfa04a"/>
      <stop offset="1" stop-color="#9b5b27"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64798a"/>
      <stop offset="1" stop-color="#263746"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bf52d"/>
      <stop offset="1" stop-color="#4eae16"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <path d="M95 870 L805 870 L755 1015 L145 1015Z"
        fill="#071522" opacity=".42" filter="url(#shadow)"/>

  <!-- 3D structural body -->
  <path d="M105 170 L795 170 L835 900 L65 900Z"
        fill="url(#side)" stroke="#182633" stroke-width="10"/>

  <!-- Main wooden ramp -->
  <path d="M140 150 L760 150 L800 850 L100 850Z"
        fill="url(#wood)" stroke="#774820" stroke-width="8"/>

  <!-- Wooden plank lines -->
  <g stroke="#a96b31" stroke-width="5" opacity=".8">
    <path d="M136 215 L764 215"/>
    <path d="M132 280 L768 280"/>
    <path d="M128 345 L772 345"/>
    <path d="M124 410 L776 410"/>
    <path d="M120 475 L780 475"/>
    <path d="M116 540 L784 540"/>
    <path d="M112 605 L788 605"/>
    <path d="M108 670 L792 670"/>
    <path d="M104 735 L796 735"/>
    <path d="M100 800 L800 800"/>
  </g>

  <!-- Subtle wood grain -->
  <g fill="none" stroke="#fff1ad" stroke-width="4" opacity=".2">
    <path d="M210 190 C280 205 340 195 410 185"/>
    <path d="M500 260 C570 245 625 250 700 270"/>
    <path d="M180 470 C250 450 310 460 380 475"/>
    <path d="M500 580 C575 560 640 570 710 590"/>
    <path d="M220 735 C290 715 350 725 420 740"/>
  </g>

  <!-- Left rail body -->
  <path d="M112 140 L152 140 L105 855 L65 855Z"
        fill="#151b20"/>
  <!-- Left rail stripes -->
  <g>
    <path d="M108 155 L148 155 L144 225 L104 225Z" fill="#f4c62c"/>
    <path d="M103 235 L144 235 L140 305 L99 305Z" fill="#171b20"/>
    <path d="M98 315 L139 315 L135 385 L94 385Z" fill="#f4c62c"/>
    <path d="M93 395 L134 395 L130 465 L89 465Z" fill="#171b20"/>
    <path d="M88 475 L129 475 L125 545 L84 545Z" fill="#f4c62c"/>
    <path d="M83 555 L124 555 L120 625 L79 625Z" fill="#171b20"/>
    <path d="M78 635 L119 635 L115 705 L74 705Z" fill="#f4c62c"/>
    <path d="M73 715 L114 715 L110 785 L69 785Z" fill="#171b20"/>
    <path d="M68 795 L109 795 L105 850 L65 850Z" fill="#f4c62c"/>
  </g>

  <!-- Right rail body -->
  <path d="M748 140 L788 140 L835 855 L795 855Z"
        fill="#151b20"/>
  <!-- Right rail stripes -->
  <g>
    <path d="M752 155 L792 155 L796 225 L756 225Z" fill="#f4c62c"/>
    <path d="M756 235 L797 235 L801 305 L760 305Z" fill="#171b20"/>
    <path d="M761 315 L802 315 L806 385 L765 385Z" fill="#f4c62c"/>
    <path d="M766 395 L807 395 L811 465 L770 465Z" fill="#171b20"/>
    <path d="M771 475 L812 475 L816 545 L775 545Z" fill="#f4c62c"/>
    <path d="M776 555 L817 555 L821 625 L780 625Z" fill="#171b20"/>
    <path d="M781 635 L822 635 L826 705 L785 705Z" fill="#f4c62c"/>
    <path d="M786 715 L827 715 L831 785 L790 785Z" fill="#171b20"/>
    <path d="M791 795 L832 795 L836 850 L796 850Z" fill="#f4c62c"/>
  </g>

  <!-- Rail highlights -->
  <path d="M121 148 L75 850" stroke="#fff29a" stroke-width="5" opacity=".7"/>
  <path d="M779 148 L825 850" stroke="#fff29a" stroke-width="5" opacity=".7"/>

  <!-- Green speed arrows -->
  <g fill="url(#green)" stroke="#3f8f12" stroke-width="3">
    <path d="M450 275 L365 350 L410 350 L410 395 L490 395 L490 350 L535 350Z"/>
    <path d="M450 405 L365 480 L410 480 L410 525 L490 525 L490 480 L535 480Z"/>
    <path d="M450 535 L365 610 L410 610 L410 655 L490 655 L490 610 L535 610Z"/>
  </g>

  <!-- Small metallic bolts -->
  <g fill="#738896" stroke="#263640" stroke-width="3">
    <circle cx="142" cy="190" r="6"/>
    <circle cx="758" cy="190" r="6"/>
    <circle cx="118" cy="520" r="6"/>
    <circle cx="782" cy="520" r="6"/>
    <circle cx="100" cy="790" r="6"/>
    <circle cx="800" cy="790" r="6"/>
  </g>

  <!-- Bottom lip -->
  <path d="M100 850 L800 850 L835 900 L65 900Z"
        fill="#7c8e9b" stroke="#263541" stroke-width="7"/>
  <path d="M115 850 L785 850 L800 875 L100 875Z"
        fill="#c78536"/>
</svg>