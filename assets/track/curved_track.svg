<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd47a"/>
      <stop offset=".5" stop-color="#d99a43"/>
      <stop offset="1" stop-color="#9b5c28"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40566b"/>
      <stop offset="1" stop-color="#142231"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <!-- Track shadow -->
  <path d="M170 120 C500 40 920 160 1030 430 C1110 630 930 790 650 810 L360 810 C650 700 780 560 700 410 C620 260 390 250 170 300Z"
        fill="#071522" opacity=".45" filter="url(#shadow)"/>

  <!-- Main curved track -->
  <path d="M145 100
           C490 25 910 125 1040 405
           C1145 630 950 825 650 835
           L390 835
           C690 730 820 580 735 425
           C650 270 400 255 155 335Z"
        fill="url(#side)" stroke="#0c1722" stroke-width="8"/>

  <!-- Wooden surface -->
  <path d="M175 125
           C490 65 870 145 985 420
           C1070 615 900 760 640 790
           L430 790
           C680 690 760 570 680 455
           C600 340 405 325 180 390Z"
        fill="url(#wood)" stroke="#74451f" stroke-width="8"/>

  <!-- Plank lines following curve -->
  <g fill="none" stroke="#9b622d" stroke-width="5" opacity=".85">
    <path d="M165 180 C430 115 800 165 900 385"/>
    <path d="M160 235 C425 170 750 205 845 395"/>
    <path d="M158 290 C410 230 700 245 790 410"/>
    <path d="M185 345 C420 300 650 300 735 425"/>
    <path d="M235 405 C420 370 600 360 700 440"/>
    <path d="M300 465 C450 435 590 420 690 470"/>
    <path d="M365 525 C500 500 610 490 680 510"/>
    <path d="M400 590 C520 570 620 555 650 555"/>
    <path d="M420 655 C530 640 610 625 610 610"/>
    <path d="M430 720 C520 705 565 690 575 670"/>
  </g>

  <!-- Left safety rail base -->
  <path d="M145 100 C490 25 910 125 1040 405"
        fill="none" stroke="#151c23" stroke-width="48" stroke-linecap="round"/>

  <!-- Right safety rail base -->
  <path d="M155 335 C400 255 650 270 735 425 C820 580 690 730 390 835"
        fill="none" stroke="#151c23" stroke-width="48" stroke-linecap="round"/>

  <!-- Yellow/black striped rail segments -->
  <g fill="none" stroke-linecap="butt" stroke-width="42">
    <path d="M145 100 C490 25 910 125 1040 405"
          stroke="#f2bf24" stroke-dasharray="70 42"/>
    <path d="M145 100 C490 25 910 125 1040 405"
          stroke="#171b20" stroke-dasharray="42 70" stroke-dashoffset="42"/>

    <path d="M155 335 C400 255 650 270 735 425 C820 580 690 730 390 835"
          stroke="#f2bf24" stroke-dasharray="70 42"/>
    <path d="M155 335 C400 255 650 270 735 425 C820 580 690 730 390 835"
          stroke="#171b20" stroke-dasharray="42 70" stroke-dashoffset="42"/>
  </g>

  <!-- Rail highlights -->
  <path d="M145 91 C490 16 915 118 1048 405"
        fill="none" stroke="#fff18a" stroke-width="4" opacity=".7"/>
  <path d="M153 326 C400 246 655 262 744 420 C830 585 695 740 390 844"
        fill="none" stroke="#fff18a" stroke-width="4" opacity=".7"/>

  <!-- Inner track edge -->
  <path d="M175 125 C490 65 870 145 985 420"
        fill="none" stroke="#70451f" stroke-width="7"/>
  <path d="M180 390 C405 325 600 340 680 455 C760 570 680 690 430 790"
        fill="none" stroke="#70451f" stroke-width="7"/>

  <!-- Small rail supports -->
  <g fill="#273440">
    <rect x="300" y="57" width="12" height="45" rx="5" transform="rotate(-12 306 80)"/>
    <rect x="520" y="47" width="12" height="45" rx="5" transform="rotate(2 526 70)"/>
    <rect x="760" y="82" width="12" height="45" rx="5" transform="rotate(18 766 105)"/>
    <rect x="940" y="180" width="12" height="45" rx="5" transform="rotate(35 946 202)"/>
    <rect x="235" y="302" width="12" height="45" rx="5" transform="rotate(-12 241 325)"/>
    <rect x="445" y="285" width="12" height="45" rx="5" transform="rotate(5 451 308)"/>
    <rect x="650" y="340" width="12" height="45" rx="5" transform="rotate(28 656 363)"/>
    <rect x="760" y="540" width="12" height="45" rx="5" transform="rotate(55 766 563)"/>
  </g>
</svg>