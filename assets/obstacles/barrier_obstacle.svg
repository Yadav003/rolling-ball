<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdf4d"/>
      <stop offset=".5" stop-color="#f0b51b"/>
      <stop offset="1" stop-color="#b96d08"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56697a"/>
      <stop offset="1" stop-color="#1b2936"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="450" cy="510" rx="310" ry="42" fill="#061522" opacity=".42" filter="url(#shadow)"/>

  <!-- Left support -->
  <path d="M145 175 L205 175 L180 485 L120 485Z" fill="url(#post)" stroke="#101a23" stroke-width="7"/>
  <path d="M125 465 L190 465 L215 500 L105 500Z" fill="#172532" stroke="#0c151d" stroke-width="6"/>

  <!-- Right support -->
  <path d="M695 175 L755 175 L780 485 L720 485Z" fill="url(#post)" stroke="#101a23" stroke-width="7"/>
  <path d="M710 465 L775 465 L795 500 L685 500Z" fill="#172532" stroke="#0c151d" stroke-width="6"/>

  <!-- Main obstacle bar -->
  <rect x="145" y="135" width="610" height="78" rx="28"
        fill="#121a22" stroke="#0a1016" stroke-width="8"/>

  <!-- Yellow safety stripes -->
  <path d="M160 140 L215 140 L175 208 L120 208Z" fill="url(#bar)"/>
  <path d="M250 140 L305 140 L265 208 L210 208Z" fill="#1b2025"/>
  <path d="M340 140 L395 140 L355 208 L300 208Z" fill="url(#bar)"/>
  <path d="M430 140 L485 140 L445 208 L390 208Z" fill="#1b2025"/>
  <path d="M520 140 L575 140 L535 208 L480 208Z" fill="url(#bar)"/>
  <path d="M610 140 L665 140 L625 208 L570 208Z" fill="#1b2025"/>
  <path d="M700 140 L755 140 L715 208 L660 208Z" fill="url(#bar)"/>

  <!-- Top highlight -->
  <rect x="165" y="143" width="570" height="9" rx="4" fill="#fff08a" opacity=".7"/>

  <!-- Bolts -->
  <g fill="#c8d5df" stroke="#18232c" stroke-width="4">
    <circle cx="180" cy="174" r="9"/>
    <circle cx="720" cy="174" r="9"/>
  </g>

  <!-- Warning lights -->
  <g>
    <circle cx="150" cy="245" r="18" fill="#ff4545"/>
    <circle cx="750" cy="245" r="18" fill="#ff4545"/>
    <circle cx="150" cy="245" r="8" fill="#ffb2a8"/>
    <circle cx="750" cy="245" r="8" fill="#ffb2a8"/>
  </g>

  <!-- Small direction chevrons -->
  <g fill="#fff0a3" opacity=".9">
    <path d="M330 285 L365 320 L330 355 L312 337 L329 320 L312 303Z"/>
    <path d="M570 285 L605 320 L570 355 L552 337 L569 320 L552 303Z"/>
  </g>
</svg>